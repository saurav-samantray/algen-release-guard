name: agent-quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
        # locked: the hash-pinned Runtime Studio runs (requirements.lock); latest: newest allowed.
        runtime: [locked, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.runtime == 'locked'
        run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: algen-release-guard --validate-config
      - run: python -m build
      - run: python scripts/package.py
